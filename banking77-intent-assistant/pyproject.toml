[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-structured-output"
version = "0.1.0"
description = "Fine-tune a small open-source LLM with LoRA to map customer-support messages to strict structured JSON intent labels (Banking77)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ML Engineering Portfolio" }]
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "datasets>=2.20",
    "trl>=0.9",
    "peft>=0.11",
    "accelerate>=0.33",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "tqdm>=4.66",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "matplotlib>=3.8"]
vllm = ["vllm>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
